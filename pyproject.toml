[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-mcp-server"
version = "1.0.0"
description = "MCP server for accessing Spark Desktop meeting transcripts"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
spark-mcp = "spark_mcp.server:main"

[tool.uv]
# Run in place with `uv run`; dependencies only, no package build
package = false
# Intel Macs: pymupdf 2.x has no x86_64 macOS wheel and needs onnxruntime 1.31,
# which has no x86_64 macOS wheel or sdist. Stay on pymupdf 1.x there.
constraint-dependencies = ["pymupdf<2; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
